services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017/mumbaicare
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      CORS_ORIGIN: http://localhost:5173
    depends_on: [mongo]
    ports: ["4000:4000"]
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  mongodata:
